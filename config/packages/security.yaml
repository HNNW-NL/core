security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\Account\Account: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }
        app_user_provider:
            entity:
                class: App\Entity\Account\Account
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: account_provider
            custom_authenticators:
                - App\Security\AccountAuthenticator
            logout:
                path: auth.logout
                target: auth.login

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # ROLE_ADMIN geeft ook meteen ROLE_USER; zo hoef je op routes die voor
    # iedereen met een account toegankelijk moeten zijn niet apart te
    # checken op beide rollen.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/auth/(login|register|forgot-password|reset-password|verify-email), roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/org, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Entity\Account\Account:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon